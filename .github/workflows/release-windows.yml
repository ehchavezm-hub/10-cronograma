name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build Windows installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: List build output
        shell: bash
        run: ls -lh dist-win/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ECM-Cronograma-Windows
          path: |
            dist-win/*.exe
            dist-win/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "ECM Project ${{ github.event.inputs.version || github.ref_name }}"
          body: |
            ## ECM Project — Ejecutable Windows

            ### Instalación
            1. Descarga el archivo `.zip`
            2. Descomprime en cualquier carpeta (ej: `C:\Programas\ECM-Project\`)
            3. Abre `ECM Cronograma.exe`
            4. Si Windows muestra advertencia: clic en **Más información** → **Ejecutar de todas formas**
            5. La aplicación no requiere conexión a internet

            ### Requisitos
            - Windows 10 / 11 (64-bit)
            - 500 MB espacio libre en disco

            ---
            ECM Project ${{ github.ref_name }} | © 2026 E. Chávez
          files: |
            dist-win/*.exe
            dist-win/*.zip
          fail_on_unmatched_files: false
