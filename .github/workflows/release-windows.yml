name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        working-directory: electron
        run: npm ci

      - name: Build Windows installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: List build output
        shell: bash
        run: ls -lh dist-win/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ECM-Cronograma-Windows
          path: |
            dist-win/*.exe
            dist-win/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ECM Cronograma ${{ github.ref_name }}"
          body: |
            ## ECM Cronograma — Ejecutable Windows

            ### Instalación
            1. Descarga `ECM-Cronograma-Setup-*.exe` (instalador) **o** `ECM-Cronograma-*.exe` (portable)
            2. Ejecuta el archivo descargado
            3. La aplicación no requiere conexión a internet

            ### Requisitos
            - Windows 10/11 (64-bit)
            - 500 MB espacio libre

            ---
            ECM Project v1.0.0 | © 2026 E. Chávez
          files: |
            dist-win/*.exe
            dist-win/*.zip
          fail_on_unmatched_files: false
